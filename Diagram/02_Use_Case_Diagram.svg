  <text x="1165" y="725" fill="#94A3B8" font-size="11">• Intercept Shortcuts (0/+1)</text>
  <text x="1165" y="750" fill="#94A3B8" font-size="11">• Instant Reload Auto-Submit</text>
  <text x="1165" y="775" fill="#94A3B8" font-size="11">• 5-Min Offline Hold Modal</text>
  <text x="1165" y="800" fill="#94A3B8" font-size="11">• 10-Demerit Limit Trigger</text>

