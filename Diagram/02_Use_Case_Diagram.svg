  <text x="880" y="605" fill="#DDD6FE" font-size="13" font-weight="600" text-anchor="middle">UC-12: 10s Heartbeat Monitoring</text>

  <!-- UC 13 (System) -->
  <ellipse cx="880" cy="680" rx="150" ry="28" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5"/>
