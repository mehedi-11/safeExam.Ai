  <text x="355" y="154" fill="#38BDF8" font-size="13" font-weight="700">safeExam.Ai Platform Boundary</text>

  <!-- ACTOR 1: STUDENT (LEFT) -->
  <rect x="50" y="260" width="220" height="360" rx="14" fill="#1E293B" stroke="#3B82F6" stroke-width="2" filter="url(#ucShadow)"/>
  <circle cx="160" cy="320" r="32" fill="#2563EB"/>
  <circle cx="160" cy="310" r="14" fill="#FFFFFF"/>
  <path d="M 138 342 Q 160 325 182 342" stroke="#FFFFFF" stroke-width="5" fill="none"/>
  <text x="160" y="380" fill="#FFFFFF" font-size="18" font-weight="700" text-anchor="middle">Student</text>
  <text x="160" y="405" fill="#93C5FD" font-size="12" text-anchor="middle">Primary Exam Candidate</text>
  <rect x="70" y="430" width="180" height="160" rx="8" fill="#0F172A"/>
  <text x="85" y="455" fill="#94A3B8" font-size="11">• Authenticate with ID</text>
  <text x="85" y="480" fill="#94A3B8" font-size="11">• Provide WebRTC Camera</text>
  <text x="85" y="505" fill="#94A3B8" font-size="11">• Answer MCQ &amp; Written</text>
  <text x="85" y="530" fill="#94A3B8" font-size="11">• Observe Demerit Meter</text>
  <text x="85" y="555" fill="#94A3B8" font-size="11">• Receive Action Modals</text>
  <text x="85" y="580" fill="#94A3B8" font-size="11">• Submit Completed Paper</text>

  <!-- ACTOR 2: TEACHER (RIGHT) -->
  <rect x="1130" y="140" width="220" height="340" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="2" filter="url(#ucShadow)"/>
  <circle cx="1240" cy="200" r="32" fill="#059669"/>
