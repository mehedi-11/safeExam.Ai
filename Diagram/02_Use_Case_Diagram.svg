<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" style="background:#0B1120; font-family:'Segoe UI', Roboto, Helvetica, sans-serif;">
  <defs>
    <linearGradient id="ucGradNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="ucShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title -->
  <rect x="50" y="25" width="1300" height="70" rx="12" fill="url(#ucGradNavy)" stroke="#334155" stroke-width="1.5" filter="url(#ucShadow)"/>
  <text x="80" y="55" fill="#38BDF8" font-size="12" font-weight="700" letter-spacing="2">SAFEEXAM.AI USE CASE MODEL</text>
  <text x="80" y="78" fill="#FFFFFF" font-size="20" font-weight="700">Role-Based Actor Interactions &amp; Proctoring Enforcements</text>

  <!-- System Boundary Boundary Box -->
  <rect x="320" y="120" width="760" height="740" rx="16" fill="#0F172A" stroke="#334155" stroke-width="2" stroke-dasharray="8,5"/>
