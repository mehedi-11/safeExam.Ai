<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="1400" height="950" style="background:#0B1120; font-family:'Segoe UI', Roboto, Helvetica, sans-serif;">
  <defs>
    <linearGradient id="wfGradNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="wfShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="wfArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="wfArrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#EF4444"/>
    </marker>
    <marker id="wfArrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <!-- Title -->
  <rect x="50" y="25" width="1300" height="70" rx="12" fill="url(#wfGradNavy)" stroke="#334155" stroke-width="1.5" filter="url(#wfShadow)"/>
  <text x="80" y="55" fill="#38BDF8" font-size="12" font-weight="700" letter-spacing="2">SAFEEXAM.AI ACTIVITY &amp; WORKFLOW LIFECYCLE</text>
  <text x="80" y="78" fill="#FFFFFF" font-size="20" font-weight="700">Chronological State Transitions &amp; Progressive Intervention Engine</text>

  <!-- SWIMLANE 1: STUDENT / CLIENT BROWSER -->
  <rect x="50" y="120" width="410" height="800" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
  <rect x="50" y="120" width="410" height="40" rx="12" fill="#1E3A8A"/>
  <text x="255" y="145" fill="#93C5FD" font-size="14" font-weight="700" text-anchor="middle">Student / Browser Client</text>

  <!-- SWIMLANE 2: AGENT ELI & HEURISTIC ENGINE -->
  <rect x="495" y="120" width="410" height="800" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
  <rect x="495" y="120" width="410" height="40" rx="12" fill="#5B21B6"/>
  <text x="700" y="145" fill="#DDD6FE" font-size="14" font-weight="700" text-anchor="middle">Agent ELI (YOLOv11 Edge Engine)</text>

  <!-- SWIMLANE 3: SERVER CONTROLLER & TEACHER FEED -->
  <rect x="940" y="120" width="410" height="800" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
  <rect x="940" y="120" width="410" height="40" rx="12" fill="#064E3B"/>
  <text x="1145" y="145" fill="#A7F3D0" font-size="14" font-weight="700" text-anchor="middle">Backend Server &amp; Teacher Console</text>

  <!-- STEP 1: START -->
  <circle cx="255" cy="190" r="16" fill="#10B981" stroke="#047857" stroke-width="2"/>
  <text x="255" y="225" fill="#E2E8F0" font-size="12" font-weight="600" text-anchor="middle">Start Session</text>
  <line x1="255" y1="235" x2="255" y2="260" stroke="#38BDF8" stroke-width="2" marker-end="url(#wfArrow)"/>

  <!-- STEP 2: Authenticate -->
  <rect x="155" y="260" width="200" height="45" rx="8" fill="#1E293B" stroke="#3B82F6"/>
  <text x="255" y="287" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">Enter ID, Password &amp; Code</text>
  <line x1="255" y1="305" x2="255" y2="335" stroke="#38BDF8" stroke-width="2" marker-end="url(#wfArrow)"/>

  <!-- STEP 3: Agree Rules & Cam -->
  <rect x="155" y="335" width="200" height="45" rx="8" fill="#1E293B" stroke="#3B82F6"/>
  <text x="255" y="355" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">Acknowledge 10-Demerit Rules</text>
  <text x="255" y="370" fill="#93C5FD" font-size="10" text-anchor="middle">&amp; Grant WebRTC Camera</text>
  <line x1="355" y1="357" x2="550" y2="357" stroke="#38BDF8" stroke-width="2" marker-end="url(#wfArrow)"/>

  <!-- STEP 4: Init YOLOv11 -->
  <rect x="550" y="335" width="300" height="45" rx="8" fill="#1E293B" stroke="#8B5CF6"/>
  <text x="700" y="355" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">Initialize YOLOv11 Model (1 FPS)</text>
  <text x="700" y="370" fill="#DDD6FE" font-size="10" text-anchor="middle">&amp; Bind Browser Event Guards</text>
  <line x1="700" y1="380" x2="700" y2="420" stroke="#38BDF8" stroke-width="2" marker-end="url(#wfArrow)"/>

  <!-- STEP 5: Proctoring Loop -->
  <rect x="525" y="420" width="350" height="150" rx="10" fill="#1E293B" stroke="#8B5CF6" stroke-dasharray="4,4"/>
  <text x="700" y="445" fill="#C4B5FD" font-size="13" font-weight="700" text-anchor="middle">Continuous Surveillance Loop</text>
  <text x="700" y="470" fill="#E2E8F0" font-size="11" text-anchor="middle">• Shortcut Pressed -> 1st Warn (0 pts) | 2nd Time (+1 pt)</text>
  <text x="700" y="492" fill="#E2E8F0" font-size="11" text-anchor="middle">• Page Reload (F5/Ctrl+R) -> Beacon Instant Auto-Submit</text>
  <text x="700" y="514" fill="#E2E8F0" font-size="11" text-anchor="middle">• Tab Switch >10s -> 5s Countdown Auto-Submit Modal</text>
  <text x="700" y="536" fill="#E2E8F0" font-size="11" text-anchor="middle">• Phone (>=5s) -> 5s Modal | Books -> +1 pt / 5s</text>
  <text x="700" y="558" fill="#FCD34D" font-size="11" text-anchor="middle">• Network Lost -> 5-Min Locked Hold Modal</text>

  <!-- Connectors from Loop -->
  <line x1="875" y1="460" x2="980" y2="460" stroke="#38BDF8" stroke-width="2" marker-end="url(#wfArrow)"/>
  <rect x="980" y="435" width="330" height="50" rx="8" fill="#1E293B" stroke="#10B981"/>
  <text x="1145" y="455" fill="#6EE7B7" font-size="12" font-weight="600" text-anchor="middle">Log Incident to MongoDB Feed</text>
  <text x="1145" y="472" fill="#94A3B8" font-size="10" text-anchor="middle">Teacher Console updates live badge</text>

  <!-- Connectors to Heartbeat -->
  <line x1="875" y1="520" x2="980" y2="520" stroke="#F59E0B" stroke-width="2" marker-end="url(#wfArrow)"/>
  <rect x="980" y="500" width="330" height="50" rx="8" fill="#1E293B" stroke="#F59E0B"/>
  <text x="1145" y="520" fill="#FCD34D" font-size="12" font-weight="600" text-anchor="middle">10s Background Heartbeat</text>
  <text x="1145" y="537" fill="#94A3B8" font-size="10" text-anchor="middle">>18s: Offline Badge | >=300s: Server Auto-Submit</text>

  <!-- DECISION DIAMOND: Demerits >= 10? -->
  <polygon points="700,610 820,660 700,710 580,660" fill="#1E293B" stroke="#EF4444" stroke-width="2"/>
  <text x="700" y="655" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">Demerits >= 10</text>
  <text x="700" y="670" fill="#FCA5A5" font-size="11" text-anchor="middle">or Critical Trigger?</text>
  <line x1="700" y1="570" x2="700" y2="610" stroke="#38BDF8" stroke-width="2" marker-end="url(#wfArrow)"/>

  <!-- Branch YES (Auto-Submit) -->
  <line x1="820" y1="660" x2="1030" y2="660" stroke="#EF4444" stroke-width="2" marker-end="url(#wfArrowRed)"/>
  <text x="890" y="650" fill="#EF4444" font-size="12" font-weight="700">YES (Threshold Breached)</text>
  
  <rect x="1030" y="635" width="280" height="50" rx="8" fill="#7F1D1D" stroke="#EF4444" stroke-width="1.5"/>
  <text x="1170" y="655" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">TRIGGER AUTO-SUBMISSION</text>
  <text x="1170" y="672" fill="#FECACA" font-size="10" text-anchor="middle">Lock Screen &amp; Send Audit Log Feed</text>

  <!-- Branch NO (Continue Answering) -->
  <line x1="580" y1="660" x2="255" y2="660" stroke="#10B981" stroke-width="2"/>
  <line x1="255" y1="660" x2="255" y2="710" stroke="#10B981" stroke-width="2" marker-end="url(#wfArrowGreen)"/>
  <text x="400" y="650" fill="#10B981" font-size="12" font-weight="700">NO (Within Safe Limits)</text>

  <rect x="155" y="710" width="200" height="50" rx="8" fill="#1E293B" stroke="#10B981"/>
  <text x="255" y="730" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">Continue Exam Answering</text>
  <text x="255" y="747" fill="#6EE7B7" font-size="10" text-anchor="middle">(30s Background Auto-Save)</text>

  <line x1="255" y1="760" x2="255" y2="795" stroke="#38BDF8" stroke-width="2" marker-end="url(#wfArrow)"/>

  <!-- Manual Submit or Timer -->
  <rect x="155" y="795" width="200" height="45" rx="8" fill="#1E293B" stroke="#3B82F6"/>
  <text x="255" y="815" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">Candidate Submits Paper</text>
  <text x="255" y="830" fill="#93C5FD" font-size="10" text-anchor="middle">or Duration Expires</text>

  <!-- Final Join -->
  <line x1="355" y1="817" x2="1170" y2="817" stroke="#38BDF8" stroke-width="2"/>
  <line x1="1170" y1="685" x2="1170" y2="817" stroke="#38BDF8" stroke-width="2"/>
  <line x1="1170" y1="817" x2="1170" y2="845" stroke="#38BDF8" stroke-width="2" marker-end="url(#wfArrow)"/>

  <!-- END -->
  <rect x="1070" y="845" width="200" height="45" rx="22" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
  <text x="1170" y="872" fill="#A7F3D0" font-size="13" font-weight="700" text-anchor="middle">✔ Evaluation &amp; Stored</text>

</svg>